version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days before proposing a release, so a compromised or broken
    # version is usually pulled first
    cooldown:
      default-days: 5
    # Titles must be conventional commits (see the PR title check)
    commit-message:
      prefix: chore
      include: scope
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Tracks the oldest supported Node major, not the newest release
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must match the conventional-changelog-writer that
      # @semantic-release/release-notes-generator bundles (8 today): a newer
      # preset major fails with "requires conventional-changelog-writer@9".
      # Move it only together with that plugin; npm test checks the pairing.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
